name: Keepalive

# GitHub disables scheduled workflows in a PUBLIC repo after 60 days with no
# repository activity - which would silently stop the PS5 watcher. This commits
# a timestamp weekly so the repo never goes quiet for that long.
#
# The PS5 watcher itself can't be relied on for this: it only commits when the
# set of PS5 listings actually changes, which may be never.

on:
  schedule:
    - cron: '17 4 * * 1'   # 04:17 UTC every Monday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Record a heartbeat
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "keepalive" || exit 0
          git pull --rebase --autostash
          git push
